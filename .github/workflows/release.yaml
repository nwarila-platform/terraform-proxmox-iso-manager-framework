name: Release

# Single release entrypoint following the canonical NWarila/terraform-framework-template
# pattern. release-please runs on push to main (gated by repo variable
# RELEASE_PLEASE_ON_PUSH for safe template adoption); on release published
# (or explicit workflow_dispatch with task=release-evidence), the evidence
# bundle is generated and attached.
#
# The canonical reusable-release-please.yaml dispatches `release.yaml` with
# task=release-evidence after creating a release; GITHUB_TOKEN-driven
# workflow_dispatch is exempt from the no-cascade rule.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      task:
        description: Release task to run.
        required: true
        type: choice
        default: release-please
        options:
          - release-please
          - release-evidence

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    # Push-triggered release-please needs the repository setting that allows
    # GitHub Actions to create pull requests. The repository variable
    # RELEASE_PLEASE_ON_PUSH must be set to 'true' for this branch to publish
    # releases on push; otherwise only explicit workflow_dispatch fires this.
    if: ${{ (github.event_name == 'push' && vars.RELEASE_PLEASE_ON_PUSH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.task == 'release-please') }}
    permissions:
      contents: write # required to create release commits, tags, and notes
      pull-requests: write # required to create and update release PRs
      issues: write # required to label and comment on release-tracking issues
      actions: write # required to dispatch release evidence after publishing
    uses: NWarila/.github/.github/workflows/reusable-release-please.yaml@f25d8d5c0fdedca23671be7bfe635b66081bfeee

  evidence:
    name: Release Evidence
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.task == 'release-evidence') }}
    permissions:
      attestations: write # required to publish artifact attestations
      contents: write # required to attach release evidence artifacts
      id-token: write # required by artifact attestation provenance
    uses: NWarila/terraform-framework-template/.github/workflows/reusable-release-evidence.yaml@3b0a832f38e8057d8531e890a666242dc32cab21
    with:
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.*)$ versioning=hashicorp
      terraform_version: "1.15.2"
      repo_type: framework
