name: Repo Hygiene
# Caller for the canonical nwarila-platform/.github reusable-repo-hygiene workflow.
# Evaluates the universal repo_hygiene OPA
# policy (SHA-pinned uses:, exact terraform/provider pins, pull_request_target
# boundary safety) against this consumer's tree without mirroring the policy
# or its input-builder locally.

on:
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    permissions:
      contents: read
    uses: nwarila-platform/.github/.github/workflows/reusable-repo-hygiene.yaml@0d2a0752d4c618907d735af4a7c12a9214c8517e
    with:
      source_ref: 0d2a0752d4c618907d735af4a7c12a9214c8517e
