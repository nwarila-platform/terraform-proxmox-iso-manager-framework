name: Repo Hygiene
# Caller for the canonical NWarila/terraform-framework-template
# reusable-repo-hygiene workflow. Evaluates the universal repo_hygiene OPA
# policy (SHA-pinned uses:, exact terraform/provider pins, pull_request_target
# boundary safety) against this consumer's tree without mirroring the policy
# or its input-builder locally.

on:
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    permissions:
      contents: read
    uses: NWarila/terraform-framework-template/.github/workflows/reusable-repo-hygiene.yaml@efcf3274d8bc6f4b192be063db8f284db6d9423a
    with:
      framework_ref: efcf3274d8bc6f4b192be063db8f284db6d9423a
