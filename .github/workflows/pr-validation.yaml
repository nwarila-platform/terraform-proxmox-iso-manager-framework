name: PR Validation

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "examples/**"
      - "tests/**"
      - "tools/**"
      - "docs/**"
      - "policies/**"
      - "Makefile"
      - ".terraform-docs.yml"
      - ".github/workflows/pr-validation.yaml"
      - ".editorconfig"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "examples/**"
      - "tests/**"
      - "tools/**"
      - "docs/**"
      - "policies/**"
      - "Makefile"
      - ".terraform-docs.yml"
      - ".github/workflows/pr-validation.yaml"
      - ".editorconfig"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: NWarila/terraform-template/.github/workflows/reusable-terraform-validation.yaml@d8f5f9b22d8d2bf6e1eeddb01a9c1cbdc3cab564
    with:
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.*)$ versioning=hashicorp
      terraform_version: "1.15.1"
      # renovate: datasource=github-releases depName=terraform-linters/tflint extractVersion=^v(?<version>.*)$
      tflint_version: "0.59.1"
      # renovate: datasource=github-releases depName=terraform-docs/terraform-docs extractVersion=^v(?<version>.*)$
      terraform_docs_version: "0.20.0"
      # renovate: datasource=github-releases depName=open-policy-agent/opa extractVersion=^v(?<version>.*)$
      opa_version: "1.10.0"
      template_ref: d8f5f9b22d8d2bf6e1eeddb01a9c1cbdc3cab564
