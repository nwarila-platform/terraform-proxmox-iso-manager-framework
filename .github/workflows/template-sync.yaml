name: Template Sync
# Caller for nwarila/terraform-template reusable-template-sync workflow.
# Renovate manages the SHA pin (both `uses:` and `template_ref:`).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: template-sync
  cancel-in-progress: false

jobs:
  sync:
    uses: NWarila/terraform-template/.github/workflows/reusable-template-sync.yaml@62ff3607cc7549a3e5a7d63cf201cdfe09e669b3
    with:
      template_ref: 62ff3607cc7549a3e5a7d63cf201cdfe09e669b3
