name: Template Sync
# Detects drift between this consumer and the canonical
# NWarila/terraform-framework-template baseline manifest. Uses the
# NWarila/drift-gate action (same pattern as the framework template's own
# drift-gate.yaml against NWarila/.github).
#
# Detection-only: this workflow does not open sync PRs. Trigger is schedule
# plus workflow_dispatch; pull_request gating will be added after the
# missing baseline-manifest.json files are backfilled into this consumer
# (tracked in docs/reference/production-readiness-handoff.md).

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: template-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: framework-template / verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drift gate (framework-template baseline)
        # renovate: datasource=git-refs depName=NWarila/drift-gate
        uses: NWarila/drift-gate@dd091e7d730b2711e09bf86c8d66b7e9b873dd53 # main @ 2026-05-26
        with:
          source-repo: NWarila/terraform-framework-template
          # renovate: depName=NWarila/terraform-framework-template packageName=NWarila/terraform-framework-template
          source-ref: dbf383819632c8bc1bbb9bbaef1cff2deccd0157 # main @ 2026-05-27 (slim manifest)
          manifest: baseline-manifest.json
          check-name: framework-template / verify
