name: Org ADR Mirror Check

# Local verifier for org ADR mirrors. This intentionally does not call a reusable
# workflow from nwarila-platform/.github because that repository does not currently
# publish one. It compares mirrors that exist upstream and warns for local org ADRs
# whose upstream master has not been published yet.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/decision-records/org/**'
      - '.github/workflows/org-adr-sync.yml'
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-adr-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Org ADR Mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compare mirrored ADRs with upstream masters
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT

          gh api repos/nwarila-platform/.github/contents/docs/decision-records \
            --jq '.[].name' > "${tmpdir}/upstream-names.txt"

          status=0

          while IFS= read -r local_file; do
            name="$(basename "${local_file}")"

            if ! grep -qx "${name}" "${tmpdir}/upstream-names.txt"; then
              echo "::warning file=${local_file}::No upstream org ADR named ${name} exists yet in nwarila-platform/.github; cannot byte-compare this mirror."
              continue
            fi

            gh api "repos/nwarila-platform/.github/contents/docs/decision-records/${name}" \
              --jq .content | base64 --decode > "${tmpdir}/${name}"

            if ! cmp -s "${local_file}" "${tmpdir}/${name}"; then
              echo "::error file=${local_file}::Org ADR mirror differs from upstream ${name}."
              status=1
            fi
          done < <(find docs/decision-records/org -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]-*.md' | sort)

          while IFS= read -r upstream_name; do
            case "${upstream_name}" in
              [0-9][0-9][0-9][0-9]-*.md)
                if [ ! -f "docs/decision-records/org/${upstream_name}" ]; then
                  echo "::error file=docs/decision-records/org::Missing upstream org ADR mirror ${upstream_name}."
                  status=1
                fi
                ;;
            esac
          done < "${tmpdir}/upstream-names.txt"

          exit "${status}"
