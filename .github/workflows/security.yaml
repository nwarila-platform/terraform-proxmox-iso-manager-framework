name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: NWarila/terraform-template/.github/workflows/reusable-iac-security.yaml@7fdf7bc711e4e5973e3308fc988df1762ad57daf
