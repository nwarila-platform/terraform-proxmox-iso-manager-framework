name: Auto-Merge
# Caller for NWarila/.github reusable-auto-merge workflow.
# Enables GitHub auto-merge on trusted-bot PRs (Renovate, template-sync,
# release-please) once required status checks pass. Human-authored PRs are
# never auto-merged. Renovate manages the SHA pin.

on:
  # zizmor: ignore[dangerous-triggers] auto-merge requires pull_request_target
  # for write permissions on PRs from forks; the reusable does not check out
  # PR head code.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    permissions:
      contents: write
      pull-requests: write
    uses: NWarila/.github/.github/workflows/reusable-auto-merge.yaml@f25d8d5c0fdedca23671be7bfe635b66081bfeee
