name: Auto-Merge
# Caller for the namespace-local reusable-auto-merge workflow.
# Enables GitHub auto-merge on trusted-bot PRs (Renovate and release-please)
# once required status checks pass. Human-authored PRs are
# never auto-merged. Review this SHA pin with the namespace workflow pins.

on:
  # zizmor: ignore[dangerous-triggers] auto-merge requires pull_request_target
  # for write permissions on PRs from forks; the reusable does not check out
  # PR head code.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: read # required to inspect trusted-bot PR metadata

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    permissions:
      contents: write # required by the reusable to enable auto-merge on trusted PRs
      pull-requests: write # required by the reusable to update PR auto-merge state
    uses: nwarila-platform/.github/.github/workflows/reusable-auto-merge.yaml@0d2a0752d4c618907d735af4a7c12a9214c8517e
