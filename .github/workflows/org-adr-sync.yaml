name: Org ADR Sync
# Verifies that org-baseline files (ADR mirrors + Diataxis .gitkeep markers)
# match the canonical nwarila-platform/.github copies. Uses the canonical
# NWarila/drift-gate composite action against
# nwarila-platform/.github/baseline-manifest.json.
#
# Mirrors the template-sync.yaml pattern; only the source-repo + source-ref
# differ.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: org-adr-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: org-baseline / verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Drift gate (nwarila-platform/.github baseline)
        # renovate: datasource=git-refs depName=NWarila/drift-gate
        uses: NWarila/drift-gate@dd091e7d730b2711e09bf86c8d66b7e9b873dd53 # main @ 2026-05-26
        with:
          source-repo: nwarila-platform/.github
          # renovate: depName=nwarila-platform/.github packageName=nwarila-platform/.github
          source-ref: 8e890d1f41fc2e4fb6162af13729ca1dfd232dd7
          manifest: baseline-manifest.json
          check-name: org-baseline / verify
