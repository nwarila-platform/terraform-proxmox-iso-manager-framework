name: Bug Report
description: Report a defect in the module's behavior, contract, or documentation.
title: "[bug] "
labels: ["bug"]
assignees:
  - NWarila

body:
  - type: input
    id: ref
    attributes:
      label: Pinned ref
      description: The `?ref=...` value your consumer pins.
      placeholder: v1.0.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal Terraform snippet (with sensitive values redacted) that triggers the issue.
      render: hcl
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Terraform version, bpg/proxmox provider version, Proxmox VE version.
      placeholder: |
        terraform: 1.9.8
        bpg/proxmox: 0.98.1
        Proxmox VE: 8.4
    validations:
      required: true
